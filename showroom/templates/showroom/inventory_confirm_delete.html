{% extends 'showroom/base.html' %}
{% block content %}
<div class="alert alert-danger mt-4 shadow">
    <h2>⚠️ ยืนยันการลบข้อมูล</h2>
    <p>คุณแน่ใจหรือไม่ว่าต้องการลบสต็อกของ <strong>{{ item.motorcycle.model_name }} (สี{{ item.color }})</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">ยืนยันการลบ</button>
        <a href="{% url 'inventory_list' %}" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>
{% endblock %}
