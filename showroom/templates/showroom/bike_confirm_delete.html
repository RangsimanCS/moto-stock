{% extends 'showroom/base.html' %}
{% block content %}
<div class="alert alert-danger mt-4 shadow">
    <h2>⚠️ ยืนยันการลบข้อมูล</h2>
    <p>คุณแน่ใจหรือไม่ว่าต้องการลบรถรุ่น <strong>{{ bike.model_name }}</strong>?</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">ยืนยันการลบ</button>
        <a href="{% url 'bike_list' %}" class="btn btn-secondary">ยกเลิก</a>
    </form>
</div>
{% endblock %}
